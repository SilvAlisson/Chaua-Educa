name: Export Cobra A2 optimized preview source
on:
  push:
    branches: [feat/snake-a2-complete-optimized-20261105]
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Export actual optimized source for local binary-art QA
        uses: actions/upload-artifact@v6
        with:
          name: snake-a2-optimized-repo-source
          path: |
            Chaua-Educa-main
            package.json
            package-lock.json
            scripts
            tests
            docs
            README.md
          compression-level: 1
          if-no-files-found: error
