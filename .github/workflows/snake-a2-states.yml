name: Cobra A2 states and legacy fallback
on:
  push:
    branches: [feat/snake-a2-complete-optimized-20261105]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --check Chaua-Educa-main/js/snake-a2.mjs
      - run: node --check Chaua-Educa-main/js/render.mjs
      - run: node --test tests/snake-a2-states.test.mjs
