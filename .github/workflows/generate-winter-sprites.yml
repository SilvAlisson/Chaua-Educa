name: Preview winter sprite generation (manual only)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  winter-art-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install art-generation dependencies
        run: python -m pip install pillow numpy
      - name: Generate candidate winter images in disposable checkout
        run: |
          python scripts/build_winter_sprites.py
          git diff --stat -- Chaua-Educa-main/assets/Seasons/Winter/
      - name: Download results for human review; NEVER push over official art
        uses: actions/upload-artifact@v6
        with:
          name: winter-sprites-proposal
          path: Chaua-Educa-main/assets/Seasons/Winter/
          if-no-files-found: error
          retention-days: 7
