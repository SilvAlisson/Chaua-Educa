name: Generate winter sprites
on:
  push:
    branches:
      - winter-troncos-neve-progressiva-v2
    paths:
      - scripts/build_winter_sprites.py
      - .github/workflows/generate-winter-sprites.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  winter-art:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install asset tool dependencies
        run: python -m pip install pillow numpy
      - name: Generate same-layout WebP sprites
        run: python scripts/build_winter_sprites.py
      - name: Commit generated winter assets to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Chaua-Educa-main/assets/Seasons/Winter/
          if ! git diff --cached --quiet; then
            git commit -m "feat(art): add winter progressive spritesheets (lossless WebP)"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
