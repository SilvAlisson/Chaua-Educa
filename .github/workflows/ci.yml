name: Validate game
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Archive exact checkout for independent end-to-end audit
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/climate-v3-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v6
        with:
          name: climate-v3-source-snapshot
          path: ${{ runner.temp }}/climate-v3-source.tar.gz
          retention-days: 7
          if-no-files-found: error
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/verify-current-spritesheets.cjs
      - run: npm test
      - run: node scripts/calibrate-climate-journey.mjs
      - run: npm run build
      - run: git diff --exit-code -- Chaua-Educa-main/css/style.css
      - run: npx playwright install --with-deps chromium
      - name: Verify actual browser rendering and complete journeys
        run: |
          python3 -m http.server 5501 --bind 127.0.0.1 --directory Chaua-Educa-main > /tmp/chaua-http.log 2>&1 &
          chaua_server_pid=$!
          trap 'kill "$chaua_server_pid" 2>/dev/null' EXIT
          # Fail fast on full real-browser flight before lengthy visual benchmarks.
          node tests/browser-attacks-weather.cjs
          node tests/browser-editorial-ui.cjs
          npm run test:journey
          node tests/browser-mobile-home-layout.cjs
          node tests/browser-animal-weather.cjs
          npm run test:surface-foods
          npm run test:quality
          npm run test:render-profile
          npm run test:auto-visual
          npm run test:perf-probe
          npm run test:perf-forensics
          npm run test:perf-experiments
          npm run test:snake-continuity
          npm run test:snake
          node tests/browser-required-action-assets.cjs
          npm run test:snake-raster-parity
          node tests/browser-v2-a2-integration.cjs
          node tests/browser-v2-a2-scenes.cjs
          node tests/browser-a2-collision-fruits.cjs
          npm run benchmark:snake-a2
          npm run test:reference-art
          npm run test:visual
          npm run test:immersion
          npm run test:browser
          node tests/browser-mobile-orientation.cjs
          node tests/browser-responsive-camera.cjs
          node tests/browser-weather-trees.cjs
          # Verify the new authored WebPs; do not green-light older placeholder assets.
          npm run test:winter-art
          node tests/browser-season-parity.cjs
          node tests/browser-climate-v3.cjs
          node tests/browser-season-atlas-semantic.cjs
          node tests/browser-weather-controls-v3.cjs
          node tests/browser-climate-rain-wet.cjs
          node tests/browser-climate-winter-v3.cjs
          node tests/browser-impact-v3.cjs
          node tests/browser-winter-breath-v3.cjs
          node scripts/benchmark-seasonal-flight.cjs
          npm run test:background
          node tests/browser-transition-fallback.cjs
          node scripts/benchmark-transition-temporal.cjs
          node scripts/benchmark-opaque-forest.cjs
          npm run test:hud
          PERF_SECONDS=6 npm run benchmark:hotspots
          npm run benchmark:render-parts
      - name: Verify GitHub Pages under the actual repository URL prefix
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pages-preview"
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/pages-preview/Chaua-Educa"
          python3 -m http.server 5502 --bind 127.0.0.1 --directory "$RUNNER_TEMP/pages-preview" > /tmp/chaua-pages-preview.log 2>&1 &
          pages_pid=$!
          trap 'kill "$pages_pid" 2>/dev/null' EXIT
          npm run test:pages-path
      - name: Save automatic graphics visual comparisons
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: auto-visual-captures
          path: |
            test-results/auto-visual/
            test-results/surface-foods/
            test-results/animal-weather/
            test-results/attacks-weather/
            test-results/mobile-home/
            test-results/editorial-ui/
            test-results/weather-trees/
            test-results/season-performance/
            test-results/climate-v3/
            test-results/season-atlas-semantic/
            test-results/climate-rain-wet/
            test-results/climate-winter-v3/
            test-results/climate-impact-v3/
            test-results/climate-breath-v3/
            test-results/responsive-camera/
            test-results/v2-action-integration/
            test-results/reference-art/
            test-results/render-parts/
            test-results/snake-strike/
            test-results/climate-calibration/
          if-no-files-found: ignore
