name: Export Chauá art references for exact visual rebuild
on:
  push:
    branches: [feat/journey-weather]
    paths: [.github/workflows/export-chaua-art-references.yml]
jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: chaua-reference-originals-for-art-rebuild
          if-no-files-found: error
          retention-days: 3
          path: |
            Chaua-Educa-main/assets/v3/forest.webp
            Chaua-Educa-main/assets/v7/trees-lower.webp
            Chaua-Educa-main/assets/v7/trees-upper.webp
            Chaua-Educa-main/assets/v9/tree-variants.webp
            Chaua-Educa-main/assets/v10/season-backgrounds.webp
            Chaua-Educa-main/assets/v10/season-particles.webp
