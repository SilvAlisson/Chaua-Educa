name: Profile stage-one actors and effects
on:
  push:
    branches:
      - diag/stage-one-actor-composition
  workflow_dispatch:
jobs:
  stage-one-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Measure scene passes with normal and dense actors
        run: |
          python3 -m http.server 5501 --bind 127.0.0.1 --directory Chaua-Educa-main > /tmp/chaua-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null' EXIT
          node scripts/diagnose-stage-one-actors.cjs
      - name: Save diagnostic measurements
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: stage-one-draw-pass-costs
          path: test-results/stage-one-actor-cost/
          if-no-files-found: ignore
