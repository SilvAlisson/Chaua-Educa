name: Stage 1 opaque-direct A/B
on:
  push:
    branches: [perf/stage1-opaque-direct-ab-20261104]
  workflow_dispatch:
jobs:
  ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Two native-RAF passes comparing staged and direct opaque forest
        run: |
          python3 -m http.server 5501 --bind 127.0.0.1 --directory Chaua-Educa-main > /tmp/stage1-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null' EXIT
          node scripts/benchmark-stage1-opaque-direct.cjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: stage1-opaque-direct-ab
          path: test-results/stage1-direct
          if-no-files-found: ignore
