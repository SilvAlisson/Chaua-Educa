name: Authentic character art and snake caching QA
on:
  push:
    branches: [feat/original-art-animations-and-snake-cache-20261105]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Verify original 56-case raster parity
        run: |
          python3 -m http.server 5501 --bind 127.0.0.1 --directory Chaua-Educa-main >/tmp/chaua-art-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null' EXIT
          node tests/browser-snake-raster-parity.cjs
          node tests/browser-original-art.cjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: authentic-character-visual-captures
          path: test-results/original-art
          if-no-files-found: ignore
