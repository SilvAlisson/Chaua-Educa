name: Real WebP sprite QA - staged gameplay
on:
  push:
    branches: [feat/action-sprites-on-optimized-20261105]
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Render real sprite atlases in the actual game
        run: |
          python3 -m http.server 5501 --bind 127.0.0.1 --directory Chaua-Educa-main >/tmp/chaua-qa-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null' EXIT
          node tests/browser-real-action-sprites.cjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: real-chaua-gameplay-visual-qa
          path: test-results/real-action-qa
          if-no-files-found: ignore
