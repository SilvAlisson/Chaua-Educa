name: Opaque forest light-key full flight A/B
on:
  push:
    branches: [perf/opaque-forest-lightkey-20261104]
  workflow_dispatch:
jobs:
  longflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Compare two complete flights with and without hidden-palette invalidations
        run: |
          python3 -m http.server 5501 --bind 127.0.0.1 --directory Chaua-Educa-main > /tmp/chaua-lightkey-long.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null' EXIT
          LONG_MODE=high LONG_SECONDS=140 LONG_KEEP_OPAQUE_LIGHTKEY=1 LONG_OUTPUT=test-results/lightkey-long/old-key npm run benchmark:long-flight
          LONG_MODE=high LONG_SECONDS=140 LONG_OUTPUT=test-results/lightkey-long/light-key npm run benchmark:long-flight
          node scripts/compare-lightkey-long.cjs
      - name: Save full-session attribution
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: forest-hidden-palette-long-ab
          path: test-results/lightkey-long
          if-no-files-found: ignore
