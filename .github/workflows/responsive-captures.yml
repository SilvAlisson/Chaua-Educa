name: Capture responsive notebook screenshots
on:
  push:
    branches:
      - fix/responsive-game-camera-20261106
  workflow_dispatch:
jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Render actual notebook and mobile screenshots
        run: |
          python3 -m http.server 5501 --bind 127.0.0.1 --directory Chaua-Educa-main > /tmp/responsive-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null' EXIT
          node tests/browser-responsive-camera.cjs
      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: responsive-game-notebook-prints
          path: test-results/responsive-camera/*.png
          if-no-files-found: error
